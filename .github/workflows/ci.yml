name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Tests (fast set)
        run: python -m pytest -m "not slow" -q

  fast-measurements:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Content hash (code, specs, library versions)
        id: hash
        run: echo "hash=$(python -m pricing_crosscheck hash)" >> "$GITHUB_OUTPUT"
      - name: Restore regenerated fast results
        uses: actions/cache@v4
        with:
          path: .cache/regenerated
          key: fast-results-${{ steps.hash.outputs.hash }}
      - name: Regenerate fast profile and compare with committed results
        run: python -m pricing_crosscheck check --profile fast --jobs 4 --regenerated .cache/regenerated
      - name: Committed full results match the current code
        run: python -m pricing_crosscheck status --profile full --allow-missing
