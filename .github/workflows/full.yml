name: full-grid

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  full-grid:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Full test suite
        run: python -m pytest -q
      - name: Content hash (code, specs, library versions)
        id: hash
        run: echo "hash=$(python -m pricing_crosscheck hash)" >> "$GITHUB_OUTPUT"
      - name: Restore regenerated full results
        uses: actions/cache@v4
        with:
          path: .cache/regenerated
          key: full-results-${{ steps.hash.outputs.hash }}
      - name: Regenerate full grid and compare with committed results
        run: python -m pricing_crosscheck check --profile full --jobs 4 --regenerated .cache/regenerated
      - name: Upload regenerated results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-results-${{ steps.hash.outputs.hash }}
          path: .cache/regenerated
          if-no-files-found: ignore
